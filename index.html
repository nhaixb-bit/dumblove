<title>dumBLove 휴대폰</title>
<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600;700&family=Lobster&display=swap">
<style>
/* Layout: one iPhone (iOS 15, dark mode) centered on a night stage; each app is a full-screen view inside it. */
:root{
  --stage:#050507;
  --bg:#000; --grp:#1c1c1e; --grp2:#2c2c2e; --fill:#3a3a3c;
  --sep:rgba(84,84,88,.65);
  --label:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --blue:#0a84ff; --red:#ff453a; --green:#30d158; --yellow:#ffd60a;
  --me:#0b84fe; --them:#26252a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--label);font-family:var(--font);overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{height:100%;display:grid;place-items:center;padding-block:14px}
.phone{position:relative;width:min(390px,100%);height:min(844px,100%);border-radius:52px;background:#0b0b0d;padding:10px;
  box-shadow:0 0 0 2px #2b2c31,0 0 0 4px #121215,0 30px 80px -20px rgba(70,80,140,.35)}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.screen img{-webkit-user-drag:none}
.wall{touch-action:none}
/* 휴대폰으로 열면 폰 틀 없이 화면을 꽉 채움 */
@media (max-width:500px),(pointer:coarse) and (max-width:900px){
  body{padding:0;background:#000}
  .stage{padding:0}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:#000}
  .screen{border-radius:0}
  .notch{display:none}
  .status{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
}

/* status bar + notch (iPhone 13, iOS 15) */
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:158px;height:31px;background:#000;border-radius:0 0 20px 20px;z-index:60}
.notch::before,.notch::after{content:"";position:absolute;top:0;width:8px;height:8px;background:radial-gradient(circle at 0 100%,transparent 8px,#000 8.5px)}
.notch::before{left:-8px;background:radial-gradient(circle at 0 100%,transparent 7.5px,#000 8px)}
.notch::after{right:-8px;background:radial-gradient(circle at 100% 100%,transparent 7.5px,#000 8px)}
.status{position:absolute;inset:0 0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 34px;
  font-size:15px;font-weight:600;letter-spacing:-.2px;z-index:55;pointer-events:none;font-variant-numeric:tabular-nums}
.status .l{width:60px;text-align:center}
.status .r{display:flex;gap:5px;align-items:center}
.batt{width:25px;height:12px;border:1px solid rgba(255,255,255,.45);border-radius:3.5px;padding:1.5px;position:relative}
.batt::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:1.5px;height:4px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.45)}
.batt i{display:block;height:100%;width:12%;background:var(--red);border-radius:1.5px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;z-index:60;pointer-events:none}
.homebar-hit{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:220px;height:24px;z-index:61}

.view{position:absolute;inset:0;padding-top:44px;display:flex;flex-direction:column;animation:zin .32s cubic-bezier(.2,.8,.2,1)}
.view.push{animation:pin .3s cubic-bezier(.2,.8,.2,1)}
.view.pop{animation:pout .3s cubic-bezier(.2,.8,.2,1)}
@keyframes zin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes pin{from{transform:translateX(30%);opacity:.6}to{transform:none;opacity:1}}
@keyframes pout{from{transform:translateX(-24%);opacity:.6}to{transform:none;opacity:1}}
.view.none{animation:none}
@media (prefers-reduced-motion:reduce){.view,.view.push,.view.pop{animation:none}}

/* lock */
.lk{position:absolute;inset:0;padding-top:44px;display:flex;flex-direction:column;will-change:transform}
.lk.snap{transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .35s}
.lockic{display:flex;justify-content:center;margin-top:10px}
.lockic svg{width:15px;height:20px}
.ltime{text-align:center;font-size:98px;font-weight:400;letter-spacing:0;line-height:1.05;margin-top:6px;
  font-family:"Lobster","Snell Roundhand",cursive;text-shadow:0 1px 12px rgba(0,0,0,.15)}
.ldate{text-align:center;font-size:21px;font-weight:500;margin-top:6px;letter-spacing:-.2px}
.notis{margin-top:40px;padding:0 9px 30px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 80px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 80px),transparent)}
.ncard{position:relative;flex:none;display:flex;gap:10px;align-items:flex-start;background:rgba(30,30,32,.62);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:20px;padding:11px 13px 12px 11px;opacity:0;transform:translateY(12px);animation:nin .5s cubic-bezier(.2,.9,.3,1) forwards;text-align:left;width:100%}
.ncard.stack{margin-bottom:9px}
.ncard.stack::after{content:"";position:absolute;left:10px;right:10px;bottom:-8px;height:16px;border-radius:0 0 16px 16px;background:rgba(30,30,32,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:-1}
@keyframes nin{to{opacity:1;transform:none}}
.nic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none}
.nic svg{width:24px;height:24px}
.ntx{flex:1;min-width:0}
.ntop{display:flex;align-items:baseline;gap:8px}
.ntop b{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntop span{font-size:13px;color:rgba(255,255,255,.55);flex:none}
.ntx p{margin:1px 0 0;font-size:15px;line-height:1.3;color:rgba(255,255,255,.92);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntx small{display:block;font-size:13px;color:rgba(255,255,255,.5);margin-top:2px}
.lbot{flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 46px 46px}
.lbtn{width:50px;height:50px;border-radius:50%;background:rgba(30,30,32,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center}
.lbtn svg{width:22px;height:22px}
.lhint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:14px;color:rgba(255,255,255,.75);pointer-events:none}
.lk.bounce{animation:bounce .5s ease}
@keyframes bounce{40%{transform:translateY(-34px)}}

/* banner */
.banner{position:absolute;left:8px;right:8px;top:8px;z-index:80;display:flex;gap:10px;align-items:flex-start;background:rgba(44,44,48,.86);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border-radius:22px;padding:11px 13px 12px 11px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.banner.on{transform:none}

.call-v>*{position:relative;z-index:1}
.c-name{font-size:32px;font-weight:400;margin-top:56px;padding:0 24px;word-break:break-all}
.c-st{font-size:17px;color:rgba(255,255,255,.7);margin-top:6px;font-variant-numeric:tabular-nums}
.c-sub{margin-top:auto;min-height:96px;padding:0 28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.c-sub .line{background:rgba(0,0,0,.45);backdrop-filter:blur(10px);border-radius:12px;padding:8px 14px;font-size:16px;line-height:1.45;max-width:100%;animation:nin .3s ease forwards;opacity:0}
.c-sub .line small{display:block;font-size:11.5px;color:rgba(255,255,255,.55);margin-bottom:1px}
.c-grid{display:grid;grid-template-columns:repeat(3,72px);gap:22px 30px;margin-top:26px}
.c-grid span{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}
.c-grid i{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.17);display:grid;place-items:center;font-style:normal}
.c-grid i svg{width:30px;height:30px}
.c-end{width:72px;height:72px;border-radius:50%;background:#ff3b30;display:grid;place-items:center;margin:34px 0 54px}
.c-end svg{width:34px;height:34px;transform:rotate(135deg)}
@media (max-height:760px){.c-grid{gap:14px 26px}.c-grid i{width:62px;height:62px}.c-end{margin:20px 0 40px}.c-name{margin-top:30px}}

.pass>*{position:relative;z-index:1}
.pass h2{font-size:20px;font-weight:400;margin:72px 0 20px}
.dots{display:flex;gap:24px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.3px solid #fff}
.dots i.on{background:#fff}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.phint{font-size:14px;color:var(--sec);margin-top:18px;min-height:20px}
.ppad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin-top:34px}
.ppad button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ppad button b{font-size:36px;font-weight:300}
.ppad button small{font-size:10px;letter-spacing:.16em;font-weight:600;margin-top:2px;min-height:10px}
.ppad button:active{background:rgba(255,255,255,.45)}
.pfoot{margin-top:auto;width:100%;display:flex;justify-content:space-between;padding:0 46px 44px;font-size:16px}
@media (max-height:740px){.ppad{grid-template-columns:repeat(3,66px);gap:12px 22px;margin-top:22px}.ppad button{width:66px;height:66px}.ppad button b{font-size:30px}.pass h2{margin-top:36px}}

.widget{background:rgba(30,30,36,.5);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px;padding:16px 18px;height:150px;display:flex;flex-direction:column}
.widget .k{font-size:13px;font-weight:600;color:#ff6b6b;letter-spacing:.02em}
.widget .big{font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:auto;line-height:1}
.widget .s{font-size:13px;color:var(--sec);margin-top:6px}
.wlabel{text-align:center;font-size:12px;margin-top:6px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 0;margin-top:22px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:#fff;letter-spacing:-.1px}
.ic{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:visible}
.ic svg{width:34px;height:34px}
.badge{position:absolute;top:-6px;right:-7px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--red);font-size:14px;font-weight:500;display:grid;place-items:center;color:#fff}
.pdots{margin-top:auto;display:flex;justify-content:center;gap:9px;margin-bottom:14px}
.pdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.pdots i.on{background:#fff}
.dock{margin:0 -14px 18px;background:rgba(60,60,70,.32);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:32px;padding:14px 12px;display:grid;grid-template-columns:repeat(4,1fr)}
.dock .app>span:not(.ic){display:none}
.toast{position:absolute;left:14px;right:14px;top:52px;background:rgba(44,44,50,.92);backdrop-filter:blur(20px);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;z-index:70;animation:nin .3s ease forwards;opacity:0}

/* iOS nav bar & lists */
.app-view{background:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 8px;position:relative;font-size:17px;color:var(--blue)}
.nav .side{display:flex;align-items:center;gap:16px;min-width:70px;padding:0 8px}
.nav .side.r{justify-content:flex-end}
.nav .ctitle{position:absolute;left:90px;right:90px;text-align:center;font-weight:600;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.back{display:flex;align-items:center;gap:2px;color:inherit;font-size:17px}
.back svg{width:13px;height:21px}
.navic{width:26px;height:26px;color:inherit;display:grid;place-items:center}
.navic svg{width:24px;height:24px}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;padding:2px 16px 8px;margin:0}
.search{margin:0 16px 10px;background:rgba(118,118,128,.24);border-radius:10px;height:36px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--sec);font-size:17px}
.search svg{width:16px;height:16px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:30px}
.scroll::-webkit-scrollbar{width:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;color:#fff;
  background:linear-gradient(180deg,#a4a8b4,#868a96)}
.av.s{width:30px;height:30px;font-size:11.5px}
.av.l{width:52px;height:52px;font-size:19px}
.av.xl{width:96px;height:96px;font-size:36px}
.seg{display:inline-flex;background:rgba(118,118,128,.24);border-radius:9px;padding:2px;font-size:13px;font-weight:600;color:var(--label)}
.seg button{padding:5px 16px;border-radius:7px;min-width:72px}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.cell{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;width:100%;text-align:left;min-height:44px}
.cell .in{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 0;border-bottom:.5px solid var(--sep);align-self:stretch}
.cell:last-child .in{border-bottom:0}
.info{width:23px;height:23px;flex:none;color:var(--blue)}
.ghead{font-size:13px;color:var(--sec);padding:20px 16px 6px;letter-spacing:.02em}
.inset{margin:0 16px;background:var(--grp);border-radius:10px;overflow:hidden}

/* messages list */
.mrow{display:flex;align-items:center;gap:0;width:100%;text-align:left;padding-left:8px}
.mrow .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin:0 6px 0 2px;flex:none;visibility:hidden}
.mrow .dot.on{visibility:visible}
.mrow .av{width:46px;height:46px;font-size:16px;margin-right:12px}
.mrow .in{flex:1;min-width:0;border-bottom:.5px solid var(--sep);padding:10px 14px 11px 0}
.mrow .top{display:flex;align-items:baseline;gap:6px}
.mrow .top b{flex:1;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .top span{font-size:15px;color:var(--sec);display:flex;align-items:center;gap:6px}
.mrow .top span svg{width:8px;height:13px}
.mrow p{margin:2px 0 0;font-size:15px;line-height:1.3;color:var(--sec);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* chat */
.chat{background:#000}
.chead{display:flex;flex-direction:column;align-items:center;padding:0 0 8px;background:rgba(22,22,24,.9);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);position:relative}
.chead .back{position:absolute;left:8px;top:8px;color:var(--blue)}
.chead .back b{font-weight:400;font-size:17px;min-width:10px}
.chead .ft{position:absolute;right:16px;top:14px;color:var(--blue)}
.chead .ft svg{width:28px;height:20px}
.chead .who{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:2px}
.chead .who span{font-size:11.5px;display:flex;align-items:center;gap:2px}
.chead .who span svg{width:6px;height:9px;opacity:.55}
.msgs{padding:6px 12px 6px 14px;display:flex;flex-direction:column}
.tl{align-self:center;font-size:11.5px;color:var(--sec);margin:16px 0 8px;font-weight:500}
.tl b{font-weight:600}
.m{display:flex;margin-top:2px;max-width:100%}
.m.gap{margin-top:9px}
.m.me{justify-content:flex-end}
.m .mav{width:30px;margin-right:8px;flex:none;align-self:flex-end;position:relative;z-index:2}
.m .mcol{display:flex;flex-direction:column;min-width:0;max-width:72%}
.m .nm{font-size:11.5px;color:var(--sec);margin:0 0 2px 12px}
.bub{position:relative;padding:7px 12px 8px;border-radius:18px;font-size:16.5px;line-height:1.3;word-break:break-all;white-space:pre-wrap;max-width:100%}
.me .bub{background:var(--me);color:#fff;max-width:72%}
.them .bub{background:var(--them);color:#fff}
.m.tail .bub::before,.m.tail .bub::after{content:"";position:absolute;bottom:0;height:20px}
.me.tail .bub::before{right:-7px;width:20px;background:var(--me);border-bottom-left-radius:16px 14px}
.me.tail .bub::after{right:-26px;width:26px;background:#000;border-bottom-left-radius:10px}
.them.tail .bub::before{left:-7px;width:20px;background:var(--them);border-bottom-right-radius:16px 14px}
.them.tail .bub::after{left:-26px;width:26px;background:#000;border-bottom-right-radius:10px}
.m .pic{display:block;width:200px;max-width:100%;border-radius:18px}
.rcpt{align-self:flex-end;font-size:11.5px;color:var(--sec);margin:3px 2px 2px;font-weight:500}
.rcpt b{font-weight:600}
.typing .bub{display:flex;gap:4px;padding:12px 14px;align-items:center}
.typing .bub i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:blink 1.3s infinite}
.typing .bub i:nth-child(2){animation-delay:.18s}.typing .bub i:nth-child(3){animation-delay:.36s}
.typing.tail .bub::before{left:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--them)}
.typing.tail .bub::after{left:-9px;bottom:-9px;width:6px;height:6px;border-radius:50%;background:var(--them)}
@keyframes blink{0%,80%,100%{opacity:.35}40%{opacity:1}}
.ibar{display:flex;gap:10px;align-items:flex-end;padding:7px 10px 30px 10px;background:#000}
.ibar.withkb{padding-bottom:6px;background:#1f1f21}
.ibar .tool{width:30px;height:30px;color:#8e8e93;display:grid;place-items:center;flex:none;margin-bottom:2px}
.ibar .tool svg{width:28px;height:28px}

  if(diff===0) return t; if(diff===1) return '어제'; if(diff<7) return WD[dt.getDay()]+'요일';
  return `${String(dt.getFullYear()).slice(2)}. ${dt.getMonth()+1}. ${dt.getDate()}.`; }

const HCHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', HJUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'],

  return (h?h+'시간 ':'')+(m?m+'분 ':'')+(s||!h&&!m?s+'초':'').trim(); }
function mergedCalls(filter){
  const list=calls.filter(c=>filter!=='miss'||c.k==='miss'); const out=[];
  list.forEach(c=>{ const l=out[out.length-1]; if(l&&l.d===c.d&&l.n===c.n&&l.k===c.k&&(l.ft||'')===(c.ft||'')){l.cnt++;l.items.push(c);} else out.push({...c,cnt:1,items:[c]}); });
  return out;
}
let recentFilter='all';
function phoneApp(tab,anim){
  let body='';
  if(tab==='fav'){
    body=`<div class="nav"><div class="side"><span style="font-size:26px;font-weight:300;line-height:1">+</span></div><div class="side r">편집</div></div><h1 class="lt">즐겨찾기</h1>
      <div class="scroll">${FAVS.map(k=>`<div class="cell" role="button" tabindex="0" data-fav="${k}" style="cursor:pointer">${av(k)}<div class="in"><div style="flex:1;min-width:0"><div style="font-size:17px;font-weight:600">${PEOPLE[k].name}</div><div style="font-size:14px;color:var(--sec);display:flex;align-items:center;gap:4px"><span style="width:13px;height:13px;display:inline-grid">${ICON.phoneS}</span>휴대전화</div></div><span class="info">${ICON.info}</span></div></div>`).join('')}</div>`;
  }
  if(tab==='recent'){
    const rows=mergedCalls(recentFilter).map((c,i)=>{ const dt=dateOfLabel(c.d);
      const title=c.ft||PEOPLE[c.n].name;
      const sub=c.ft?'FaceTime 영상':'휴대전화';
      const og=(c.k==='out'||c.k==='fail')?ICON.og:'';
      return `<div class="callrow" role="button" tabindex="0" data-i="${i}"><span class="og">${og}</span><div class="in"><div class="nmc"><b class="${c.k==='miss'?'miss':''}${c.ft?' ft':''}">${esc(title)}${c.cnt>1?` <span class="n">(${c.cnt})</span>`:''}</b><small>${sub}</small></div><span class="when">${relDate(dt,c.t)}</span><button class="info" data-info="${i}" aria-label="정보">${ICON.info}</button></div></div>`; }).join('');
    body=`<div class="nav"><div class="side"></div><div class="seg" style="position:absolute;left:50%;transform:translateX(-50%)"><button data-f="all" class="${recentFilter==='all'?'on':''}">전체</button><button data-f="miss" class="${recentFilter==='miss'?'on':''}">부재중</button></div><div class="side r">편집</div></div>
      <h1 class="lt">최근 통화</h1><div class="scroll">${rows}</div>`;
  }
  if(tab==='contacts'){
    const sorted=CONTACTS.slice().sort((a,b)=>PEOPLE[a].name.localeCompare(PEOPLE[b].name,'ko'));
    let html='',g=null; const letters=[];
    sorted.forEach(k=>{const c=cho(PEOPLE[k].name); if(c!==g){g=c;letters.push(c);html+=`<div class="ghead" style="padding:14px 16px 4px;font-weight:600">${c}</div>`;}
      html+=`<div class="cell" style="min-height:44px"><div class="in" style="font-size:17px">${PEOPLE[k].name}</div></div>`;});
    body=`<div class="nav"><div class="side">그룹</div><div class="side r"><span style="font-size:26px;font-weight:300;line-height:1">+</span></div></div><h1 class="lt">연락처</h1><div class="search">${ICON.mag}검색</div>
      <div class="scroll">${html}<div style="text-align:center;color:var(--sec);font-size:15px;padding:18px 0">연락처 ${sorted.length}개</div></div><div class="idx">${letters.map(l=>`<span>${l}</span>`).join('')}</div>`;
  }
  if(tab==='keypad'){
    const k=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
    body=`<div class="kp"><div class="kadd" id="kadd"></div><div class="kdisp" id="kd"></div><div class="kgrid">${k.map(x=>`<button data-d="${x[0]}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div>
      <div class="kcall"><span></span><button class="go" id="kgo" aria-label="통화">${ICON.phoneG}</button><button class="del" id="kdel" aria-label="지우기" style="visibility:hidden">${ICON.del}</button></div></div>`;
  }
  if(tab==='vm'){
    body=`<div class="nav"><div class="side">인사말</div><div class="side r">편집</div></div><h1 class="lt">음성 사서함</h1><div class="scroll">
      <div class="vm"><span class="dotc"><i></i></span><div class="in"><div class="top"><b>재현이 형</b><span>오전 1:52</span><span class="info">${ICON.info}</span></div>
        <small>휴대전화</small>
        <div class="vplay"><div class="vbar"><i></i></div><div class="vtimes"><span>0:00</span><span>-0:14</span></div>
        <div class="vbtns"><span class="pl">${ICON.play}</span><span>${ICON.spk}</span><span>${ICON.phoneS}</span><span style="color:var(--red)">${ICON.trash}</span></div>
        <div class="vtx"><small>텍스트 변환 (베타)</small>형... 저예요... 운학이... 전화 좀 받아줘요...</div></div></div></div>
    </div>`;
  }
  const el=setView(body+`<nav class="tabbar">${TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${TABI[t[0]]}<span>${t[1]}</span></button>`).join('')}</nav>`,'app-view',anim);
  // 홈으로: 왼쪽 위 뒤로
  const nav=el.querySelector('.nav'); if(nav){ const s=nav.querySelector('.side'); s.innerHTML=backBtn('홈')+s.innerHTML; }
  else { el.insertAdjacentHTML('afterbegin',`<div class="nav"><div class="side">${backBtn('홈')}</div></div>`); }
  wireBack(el,home);
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>phoneApp(b.dataset.t));
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{recentFilter=b.dataset.f;phoneApp('recent');});
  if(tab==='recent'){ const list=mergedCalls(recentFilter);
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>{ const c=list[+b.dataset.i]; if(e.target.closest('[data-info]')) callDetail(c); else callScreen(c.n,c.ft,()=>phoneApp('recent')); }); }
  if(tab==='fav'){ el.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{ if(e.target.closest('.info')) return; callScreen(b.dataset.fav,null,()=>phoneApp('fav')); }); }
  if(tab==='keypad'){ const kd=el.querySelector('#kd'), ka=el.querySelector('#kadd'), del=el.querySelector('#kdel');
    const upd=()=>{ ka.textContent=kd.textContent?'번호 추가':''; del.style.visibility=kd.textContent?'visible':'hidden'; };
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ if(kd.textContent.length<13) kd.textContent+=b.dataset.d; upd(); });
    del.onclick=()=>{ kd.textContent=kd.textContent.slice(0,-1); upd(); };
    el.querySelector('#kgo').onclick=()=>{ if(!kd.textContent){ kd.classList.remove('shake'); void kd.offsetWidth; kd.classList.add('shake'); return; } callScreen(kd.textContent,null,()=>phoneApp('keypad')); }; }
}
function callDetail(c){
  const dt=dateOfLabel(c.d);
  const same=calls.filter(x=>x.d===c.d&&x.n===c.n&&(x.ft||'')===(c.ft||''));
  const title=c.ft||PEOPLE[c.n].name;
  const lines=same.map(x=>`<div class="ln${x.k==='miss'?' miss':''}"><span>${x.t}</span><span>${(x.ft?'FaceTime ':'')+KIND[x.k]}</span><span>${durText(x.dur)}</span></div>`).join('');
  const el=setView(`<div class="nav"><div class="side">${backBtn('최근 통화')}</div><div class="side r">편집</div></div>
    <div class="scroll"><div class="cd-top">${av(c.n,'xl')}<h2>${esc(title)}</h2></div>
    <div class="cd-acts"><span>${ICON.msgS}메시지</span><button id="cdcall" style="display:contents"><span>${ICON.phoneS}통화</span></button><span>${ICON.vid.replace('<svg','<svg style="width:24px;height:18px"')}영상</span><span>${ICON.mailS}메일</span></div>
    <div class="inset cd-log"><div class="dt">${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일</div>${lines}</div>
    ${same.filter(x=>x.tr).map(x=>`<div class="ghead">${x.t} 통화 내용</div><div class="inset cd-tr">${x.tr.map(l=>`<div class="trl"><small>${PEOPLE[x.n].name}</small>${esc(l)}</div>`).join('')}</div>`).join('')}
    <div class="inset" style="margin-top:12px"><div class="cd-field"><small>${c.ft?'FaceTime':'휴대전화'}</small><span>${c.ft?esc(c.ft):'010-••••-••••'}</span></div></div></div>`,'app-view','push');
  wireBack(el,()=>phoneApp('recent','pop'));
  el.querySelector('#cdcall').onclick=()=>callScreen(c.n,c.ft,()=>callDetail(c));
}

/* ---------- photos ---------- */

        <button class="cell" id="hid"><div class="in"><span style="font-size:17px">가려진 항목</span><span style="color:var(--sec);display:flex;gap:6px;align-items:center">🔒${ICON.chevR.replace('<svg','<svg style="width:8px;height:13px"')}</span></div></button>
        <div class="cell"><div class="in"><span style="font-size:17px">최근 삭제된 항목</span><span style="color:var(--sec)">0</span></div></div></div></div>`;
  }
  const el=setView(body+`<nav class="tabbar four">${[['lib','보관함'],['foryou','For You'],['albums','앨범'],['psearch','검색']].map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${TABI[t[0]]}<span>${t[1]}</span></button>`).join('')}</nav>`,'app-view',anim);
  if(tab==='lib'){ el.insertAdjacentHTML('afterbegin',`<div class="nav"><div class="side">${backBtn('홈')}</div></div>`); }
  else { const s=el.querySelector('.nav .side'); s.innerHTML=backBtn('홈'); }
  wireBack(el,home);
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ if(b.dataset.t==='lib'||b.dataset.t==='albums') photos(b.dataset.t); });
  const open=()=>{ const v=setView(`<div class="nav"><div class="side">${backBtn('')}</div><div class="ctitle" style="line-height:1.2">2025년 12월 11일<br><small style="color:var(--sec);font-size:11.5px;font-weight:400">오후 4:15</small></div><div class="side r">편집</div></div>
      <div class="pview"><img src="${PHOTO}" alt="합주실 소파에서 베이스 치는 사진"></div>
      <div class="ptool"><span>${ICON.share}</span><span>${ICON.heart}</span><span>${ICON.info}</span><span>${ICON.trash}</span></div>`,'app-view','push'); wireBack(v,()=>photos(tab,'pop')); };
  const g=el.querySelector('#g1'); if(g) g.onclick=open;
  const a1=el.querySelector('#ab1'); if(a1) a1.onclick=()=>photos('lib','push');
  const h=el.querySelector('#hid'); if(h) h.onclick=()=>toast('Face ID가 필요합니다.');
}

/* ---------- notes ---------- */
const MEMO_WHEN=['어제','12. 31.','12. 20.','11. 21.','10. 2.'];
function memoList(anim){

    const m=memos[b.dataset.m];

      <div class="scroll"><div class="nbody">${m.h.replace(/<h2>([\s\S]*?)<\/h2>(\s*)<div class="when">([\s\S]*?)<\/div>/,'<div class="when">$3</div><h2>$1</h2>')}</div></div>`,'app-view notes','push');

}

/* ---------- calendar ---------- */
const CAL={
  11:{y:2025,start:6,days:30,ev:{17:[['동아리실','방과 후']],20:[['수능','하루 종일 · 셋째 주 목요일']],30:[['D-31','하루 종일']]}},
  12:{y:2025,start:1,days:31,ev:{4:[['형 생일♥','하루 종일']],20:[['형이 술 사준다고 약속한 날','하루 종일']],25:[['크리스마스','하루 종일']],31:[['D-DAY','하루 종일'],['0시 되면 보내기. 떨지 말기','오후 11:59']]}},
  1:{y:2026,start:4,days:31,ev:{1:[['스무 살','하루 종일']],2:[['벽음 첫 술 (미룸)','오후 7:00']]}}
};
function calView(mon,sel,anim){
  const m=CAL[mon]; const isToday=d=>mon===1&&d===1;
  if(sel==null) sel=mon===1?1:mon===12?31:20;
  let cells='';
  for(let i=0;i<m.start;i++) cells+='<div class="d"></div>';
  for(let d=1;d<=m.days;d++){
    const dow=(m.start+d-1)%7, ev=m.ev[d];
    const cls=`d${dow===0?' sun':''}${dow===6?' sat':''}${isToday(d)?' today':''}${ev?' has':''}${d===sel?' sel':''}`;
    cells+=ev?`<button class="${cls}" data-day="${d}"><span class="num">${d}<i></i></span><span class="note">${ev[0][0]}</span></button>`:`<div class="${cls}"><span class="num">${d}</span></div>`;
  }
  const evs=m.ev[sel]||[]; const dw=WD[(m.start+sel-1)%7];
  const list=`<div class="evday">${mon}월 ${sel}일 ${dw}요일${isToday(sel)?' · 오늘':''}</div>`+(evs.length?evs.map(e=>`<div class="ev"><i></i><b>${e[0]}</b><span>${e[1]}</span></div>`).join(''):`<div style="color:var(--sec);font-size:15px;padding:10px 0">이벤트 없음</div>`);
  const prev=mon===1?12:mon===12?11:null, next=mon===11?12:mon===12?1:null;
  const el=setView(`<div class="nav"><div class="side">${backBtn(m.y+'년')}</div><div class="side r"><button class="navic" data-m="${prev||''}" ${prev?'':'disabled style="opacity:.3"'} aria-label="이전 달">${ICON.chev.replace('<svg','<svg style="width:11px;height:18px"')}</button><button class="navic" data-m="${next||''}" ${next?'':'disabled style="opacity:.3"'} aria-label="다음 달" style="transform:scaleX(-1)${next?'':';opacity:.3'}">${ICON.chev.replace('<svg','<svg style="width:11px;height:18px"')}</button><span style="font-size:26px;font-weight:300;line-height:1">+</span></div></div>
    <div class="cmonth">${mon}월</div>
    <div class="wk">${[...WD].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="scroll"><div class="days">${cells}</div><div class="evlist">${list}</div></div>`,'app-view cal',anim);
  wireBack(el,home);
  el.querySelectorAll('[data-m]').forEach(b=>{ if(b.dataset.m) b.onclick=()=>calView(+b.dataset.m); });
  el.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>calView(mon,+b.dataset.day,'none'));
}

document.getElementById('homeHit').onclick=()=>{ curChat=null; if(unlocked) home(); else pass(); };
lock();
})();
